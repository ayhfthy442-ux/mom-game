<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fdf3f6">
<title>بيتنا الصغير — أم وبيبي</title>
<style>
:root{
  --bg:#fdf3f6; --card:#ffffff; --ink:#3c2b35; --muted:#9b8792;
  --pink:#e26a92; --pink2:#f7c9d8; --gold:#c9a227; --line:#f0dfe6;
  --green:#3f9e72; --blue:#5b8fd6; --shadow:0 6px 18px rgba(180,110,140,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,Arial,sans-serif;
  background:
    radial-gradient(1200px 500px at 50% -10%, #ffe6ef 0%, transparent 60%),
    var(--bg);
  color:var(--ink); min-height:100vh;
}
#app{max-width:640px;margin:0 auto;padding:0 12px 92px}
header.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:10px 4px;background:linear-gradient(#fdf3f6 70%,rgba(253,243,246,0));
}
header.top .brand{font-weight:800;font-size:18px;letter-spacing:.2px}
header.top .brand span{color:var(--pink)}
header.top .spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;
  box-shadow:var(--shadow);font-weight:700;white-space:nowrap;
}
.pill.gold{color:#8a6a12;background:linear-gradient(#fff9e6,#fff2c9);border-color:#f0dfa5}
h2.sec{font-size:16px;margin:18px 4px 10px}
h2.sec small{font-weight:500;color:var(--muted);font-size:12px;margin-inline-start:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.muted{color:var(--muted);font-size:13px;line-height:1.7}
button{font-family:inherit}
.btn{
  border:0;border-radius:16px;padding:12px 16px;font-size:15px;font-weight:800;cursor:pointer;
  background:var(--pink);color:#fff;box-shadow:0 6px 14px rgba(226,106,146,.32);
  transition:transform .08s ease, filter .15s ease;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--pink);border:1.5px solid var(--pink2);box-shadow:none}
.btn.soft{background:#fbe7ee;color:#a94d70;box-shadow:none}
.btn:disabled{opacity:.45;filter:grayscale(.3);cursor:default}
.big{width:100%;padding:16px;font-size:17px;border-radius:18px}

/* ---------- start ---------- */
.hero{text-align:center;padding:26px 8px 8px}
.hero .logo{font-size:58px;line-height:1}
.hero h1{font-size:26px;margin:10px 0 4px}
.hero p{color:var(--muted);margin:0 0 6px;font-size:14px}
.field{margin:14px 0}
.field label{display:block;font-size:13px;font-weight:800;margin:0 4px 8px;color:#6b4c5b}
.field input, .field select{
  width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;
  padding:13px 14px;font-size:16px;font-family:inherit;color:var(--ink);outline:none;
}
.field input:focus{border-color:var(--pink2)}
.gender{display:flex;gap:10px}
.gender button{
  flex:1;border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:14px 8px;
  font-size:15px;font-weight:800;color:#7a5c6a;cursor:pointer;
}
.gender button.on{border-color:var(--pink);background:#fdeaf1;color:#b5436b;box-shadow:var(--shadow)}
.gender .em{font-size:26px;display:block;margin-bottom:4px}

/* ---------- hospital ---------- */
.hosp{
  position:relative;margin-top:10px;border-radius:26px;overflow:hidden;height:320px;
  background:linear-gradient(#fff,#fdeef4 70%,#fbdbe6);border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.hosp .window{position:absolute;inset:18px 22px auto auto;width:110px;height:80px;border-radius:14px;background:linear-gradient(#bfe3ff,#e9f7ff);border:6px solid #fff;box-shadow:0 4px 12px rgba(90,130,180,.18)}
.hosp .cross{position:absolute;top:22px;left:22px;width:44px;height:44px;border-radius:12px;background:#fff;box-shadow:var(--shadow);font-size:26px;display:grid;place-items:center;color:#e05b7d;font-weight:900}
.hosp .bed{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:260px;height:130px}
.hosp .mattress{position:absolute;left:0;right:0;bottom:34px;height:52px;border-radius:16px;background:#fff;border:2px solid #f2dbe4}
.hosp .pillow{position:absolute;right:18px;bottom:70px;width:60px;height:26px;border-radius:12px;background:#fff;border:2px solid #f2dbe4}
.hosp .legs{position:absolute;left:8px;right:8px;bottom:0;height:34px;border-inline:10px solid #d9c6cf;border-radius:0 0 8px 8px}
.hosp .baby{position:absolute;left:50%;top:-26px;transform:translateX(-50%);font-size:46px;animation:sway 2.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-50%) rotate(-4deg)}50%{transform:translateX(-50%) rotate(4deg)}}
.hosp .nurse{position:absolute;left:18px;bottom:36px;font-size:52px}
.spark{position:absolute;font-size:18px;opacity:.8;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}

/* ---------- tabs ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  padding:8px 10px 14px;background:linear-gradient(rgba(253,243,246,0),#fdf3f6 35%);
}
nav.tabs .inner{
  display:flex;gap:2px;background:rgba(255,255,255,.92);border:1px solid var(--line);
  border-radius:22px;padding:6px;box-shadow:0 10px 26px rgba(170,110,140,.18);
  backdrop-filter:blur(8px);max-width:620px;width:100%;justify-content:space-between;
}
nav.tabs button{
  flex:1;border:0;background:transparent;border-radius:16px;padding:8px 2px;cursor:pointer;
  font-size:11px;font-weight:800;color:#9a7e8b;display:flex;flex-direction:column;gap:3px;align-items:center;
}
nav.tabs button .i{font-size:19px;line-height:1}
nav.tabs button.on{background:#fde8ef;color:#b5436b}

/* ---------- home ---------- */
.room{
  position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(#ffeef5,#f7dce7);box-shadow:var(--shadow);padding:12px;
}
.avatar-wrap{display:flex;justify-content:center;align-items:flex-end;min-height:250px}
svg{display:block}
.bubble{
  position:absolute;top:12px;left:12px;max-width:200px;background:#fff;border-radius:16px;
  padding:10px 12px;font-size:13px;line-height:1.5;box-shadow:var(--shadow);border:1px solid var(--line);
}
.bubble:after{content:"";position:absolute;left:22px;bottom:-8px;border:8px solid transparent;border-top-color:#fff}
.stat{margin:8px 0}
.stat .lab{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#7c5d6b;margin-bottom:4px}
.bar{height:10px;border-radius:99px;background:#f4e6ec;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{
  border:1px solid var(--line);background:#fff;border-radius:18px;padding:12px 8px;cursor:pointer;
  font-weight:800;font-size:13px;color:#6b4c5b;display:flex;flex-direction:column;gap:6px;align-items:center;
  box-shadow:0 3px 10px rgba(180,120,150,.08);
}
.act:active{transform:scale(.97)}
.act .i{font-size:24px}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.task:last-child{border-bottom:0}
.task .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--pink2);display:grid;place-items:center;font-size:13px;color:#fff;flex:none}
.task.done .tick{background:var(--green);border-color:var(--green)}
.task.done .tx{text-decoration:line-through;color:var(--muted)}

/* ---------- wardrobe ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;
  font-size:13px;font-weight:800;color:#8a6d7b;cursor:pointer;
}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.item{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 3px 10px rgba(180,120,150,.07);
}
.item .sw{height:54px;border-radius:12px;position:relative;overflow:hidden}
.item .sw:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.5),transparent 55%)}
.item .nm{font-size:12.5px;font-weight:800;line-height:1.35}
.item .pr{font-size:11.5px;color:var(--muted)}
.item .bx{display:flex;gap:6px;margin-top:auto}
.item .bx button{flex:1;border:0;border-radius:10px;padding:8px 4px;font-size:12px;font-weight:800;cursor:pointer;background:#fbe7ee;color:#a94d70}
.item .bx button.p{background:var(--pink);color:#fff}
.item .bx button.g{background:#e8f5ee;color:#2c7a54}
.item .bx button.r{background:#fdecec;color:#c0392b}
.item .badge{position:absolute;top:6px;right:6px;background:#fff;border-radius:8px;font-size:10px;font-weight:900;padding:3px 7px;color:#8a6a12}
.tabs2{display:flex;gap:8px;margin:4px 0 12px}
.tabs2 button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px;font-weight:800;font-size:14px;color:#8a6d7b;cursor:pointer}
.tabs2 button.on{border-color:var(--pink);background:#fdeaf1;color:#b5436b}

/* ---------- makeup ---------- */
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(120,80,100,.22);cursor:pointer;position:relative}
.dot.on{outline:3px solid var(--pink);outline-offset:2px}
.look{
  border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;font-weight:800;font-size:13px;color:#7a5c6a;cursor:pointer;
}
.look.on{border-color:var(--pink);background:#fdeaf1;color:#b5436b}

/* ---------- outings ---------- */
.dests{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dest{
  border:1px solid var(--line);background:#fff;border-radius:20px;padding:14px;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;text-align:center;box-shadow:0 3px 10px rgba(180,120,150,.07);
}
.dest .em{font-size:34px}
.dest .nm{font-weight:800;font-size:14px}
.dest .sb{font-size:11.5px;color:var(--muted)}
.bed{
  position:relative;border-radius:20px;background:linear-gradient(#fff,#f6eef1);border:1px solid var(--line);
  padding:16px 12px 12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
}
.bed .slot{background:#fff;border:1px dashed #e5c9d4;border-radius:14px;min-width:74px;padding:8px;text-align:center;font-size:11px;color:var(--muted)}
.bed .slot b{display:block;font-size:12px;color:var(--ink);margin-top:2px}
.bed .pillow2{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:20px;opacity:.5}

/* ---------- album ---------- */
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
.photo .im{height:110px;display:grid;place-items:center;font-size:42px;background:linear-gradient(160deg,#ffe9f1,#f4dbe6)}
.photo .cap{padding:8px 10px;font-size:12px;line-height:1.5}
.photo .cap b{display:block}
.photo .del{border:0;background:#fdecec;color:#c0392b;font-weight:800;font-size:11px;width:100%;padding:7px;cursor:pointer}

/* ---------- features ---------- */
.feat{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px dashed var(--line);font-size:14px}
.feat:last-child{border-bottom:0}
.feat .n{font-size:11px;color:var(--muted);width:34px;flex:none}
.feat .sp{flex:1}
.switch{width:46px;height:27px;border-radius:99px;background:#e7d7df;position:relative;border:0;cursor:pointer;flex:none;transition:background .2s}
.switch:after{content:"";position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--green)}
.switch.on:after{transform:translateX(-19px)}
.count{font-size:34px;font-weight:900;color:var(--pink);line-height:1.1}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#3c2b35;color:#fff;
  padding:12px 18px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;
  transition:all .25s ease;z-index:60;max-width:92%;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">بيتنا <span>الصغير</span></div>
    <div class="spacer"></div>
    <div class="pill gold" id="coins">🪙 0</div>
    <div class="pill" id="lvl">⭐ 1</div>
  </header>
  <main id="screen"></main>
</div>
<nav class="tabs hidden" id="tabs"><div class="inner"></div></nav>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const KEY = "momgame.v1";
const rand = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const COLORS = [
  {id:"rose",   n:"وردي",       h:"#ef8fae"},
  {id:"pink",   n:"فوشيا",      h:"#dd5a97"},
  {id:"red",    n:"أحمر",       h:"#d84a4a"},
  {id:"burgundy",n:"نبيتي",     h:"#8e3b4f"},
  {id:"purple", n:"بنفسجي",     h:"#9a6bd4"},
  {id:"blue",   n:"أزرق",       h:"#5b8fd6"},
  {id:"navy",   n:"كحلي",       h:"#39456b"},
  {id:"teal",   n:"تركواز",     h:"#3fb2a8"},
  {id:"green",  n:"أخضر",       h:"#66a96b"},
  {id:"yellow", n:"أصفر",       h:"#e8c34a"},
  {id:"orange", n:"برتقالي",    h:"#ef9450"},
  {id:"black",  n:"أسود",       h:"#3a3d46"},
  {id:"white",  n:"أبيض",       h:"#faf6ee"},
  {id:"beige",  n:"بيج",        h:"#d9c3a2"}
];
const colorOf = id => COLORS.find(c=>c.id===id) || COLORS[0];

const SEASONS = {summer:"الصيف", winter:"الشتاء", spring:"الربيع", autumn:"الخريف"};
const SEASON_EM = {summer:"☀️", winter:"❄️", spring:"🌸", autumn:"🍂"};
function seasonNow(){
  const m = new Date().getMonth()+1;
  if([12,1,2].includes(m)) return "winter";
  if([3,4,5].includes(m)) return "spring";
  if([6,7,8].includes(m)) return "summer";
  return "autumn";
}
const seasonName = s => SEASONS[s] || "";

/* ================= catalogue ================= */
const KINDS = [
  {cat:"dress", kind:"short",  n:"فستان قصير",        w:"light", p:45},
  {cat:"dress", kind:"midi",   n:"فستان نص طويل",     w:"light", p:55},
  {cat:"dress", kind:"long",   n:"فستان طويل",        w:"light", p:65},
  {cat:"dress", kind:"shortH", n:"فستان قصير ثقيل",   w:"heavy", p:60},
  {cat:"dress", kind:"midiH",  n:"فستان نص طويل ثقيل",w:"heavy", p:70},
  {cat:"dress", kind:"longH",  n:"فستان طويل ثقيل",   w:"heavy", p:85},
  {cat:"top",   kind:"blouse", n:"بلوزة",             w:"light", p:30},
  {cat:"top",   kind:"sweater",n:"سويتر صوف",         w:"heavy", p:40},
  {cat:"bottom",kind:"skirt",  n:"جيبة",              w:"light", p:30},
  {cat:"bottom",kind:"wide",   n:"بنطلون واسع",       w:"light", p:35},
  {cat:"bottom",kind:"jeans",  n:"جينز",              w:"heavy", p:40},
  {cat:"shoes", kind:"heels",  n:"كعب",               w:"light", p:35},
  {cat:"shoes", kind:"flats",  n:"باليرينا",          w:"light", p:25},
  {cat:"shoes", kind:"sneakers",n:"سنيكرز",           w:"all",   p:30},
  {cat:"shoes", kind:"boots",  n:"بوت",               w:"heavy", p:45},
  {cat:"shoes", kind:"sandals",n:"صندل",              w:"light", p:25},
  {cat:"bag",   kind:"hand",   n:"شنطة يد",           w:"all",   p:40},
  {cat:"bag",   kind:"tote",   n:"شنطة كتف",          w:"all",   p:35},
  {cat:"bag",   kind:"clutch", n:"كلاتش",             w:"all",   p:30},
  {cat:"bag",   kind:"backpack",n:"شنطة ظهر",         w:"all",   p:35},
  {cat:"acc",   kind:"headband",n:"طوق شعر",          w:"all",   p:15},
  {cat:"acc",   kind:"necklace",n:"عقد",              w:"all",   p:20},
  {cat:"acc",   kind:"earrings",n:"حلق",              w:"all",   p:20},
  {cat:"acc",   kind:"sunglasses",n:"نظارة شمس",      w:"all",   p:18},
  {cat:"acc",   kind:"scarf",  n:"إيشارب",            w:"all",   p:22},
  {cat:"acc",   kind:"gloves", n:"جوانتي",            w:"heavy", p:18}
];
const CAT_NAMES = {dress:"فساتين", top:"بلوزات", bottom:"بنطلونات وجيبات", shoes:"أحذية", bag:"شنط", acc:"إكسسوارات"};

const BABY_KINDS = [
  {kind:"onesie", n:"أفرول بيبي",  w:"light", p:30},
  {kind:"suit",   n:"طقم بيبي",    w:"heavy", p:40},
  {kind:"dressB", n:"فستان بيبي",  w:"light", p:35},
  {kind:"pajama", n:"بيجامة بيبي", w:"heavy", p:32},
  {kind:"hat",    n:"طاقية بيبي",  w:"all",   p:15},
  {kind:"bootie", n:"جزم بيبي",    w:"all",   p:18}
];

function buildCatalogue(){
  const G = [];
  for(const k of KINDS){
    for(const c of COLORS){
      G.push({id:k.kind+"_"+c.id, cat:k.cat, kind:k.kind, name:k.n, color:c.id, w:k.w, p:k.p + (c.id==="white"?5:0)});
    }
  }
  return G;
}
const GARMENTS = buildCatalogue();
function babyCatalogue(){
  const B=[];
  for(const k of BABY_KINDS){
    for(const c of COLORS){
      B.push({id:"b_"+k.kind+"_"+c.id, cat:"baby", kind:k.kind, name:k.n, color:c.id, w:k.w, p:k.p});
    }
  }
  return B;
}
const BABY_ITEMS = babyCatalogue();
const byId = id => GARMENTS.find(g=>g.id===id) || BABY_ITEMS.find(b=>b.id===id) || null;

const LIPS = [
  {id:"nude", n:"نود", h:"#c98a7f"}, {id:"rose", n:"وردي", h:"#d8697f"},
  {id:"coral", n:"مرجاني", h:"#e07a5f"}, {id:"red", n:"أحمر كلاسيك", h:"#c0392b"},
  {id:"berry", n:"توتي", h:"#9d3d5c"}, {id:"fuchsia", n:"فوشيا", h:"#cf3f84"},
  {id:"plum", n:"برقوقي", h:"#7b3657"}, {id:"peach", n:"خوخي", h:"#ef9f93"},
  {id:"brown", n:"بني دافئ", h:"#8a5a4a"}, {id:"gloss", n:"شفاف لامع", h:"#e9b9be"}
];
const EYES = [
  {id:"none", n:"بدون", h:"transparent"}, {id:"nude", n:"بيج هادئ", h:"#d9b9a3"},
  {id:"rose", n:"وردي", h:"#d98b9c"}, {id:"mauve", n:"موف", h:"#a97a9a"},
  {id:"brown", n:"بني", h:"#8a6a52"}, {id:"gold", n:"ذهبي", h:"#c9a227"},
  {id:"blue", n:"أزرق", h:"#6b9bd1"}, {id:"green", n:"أخضر", h:"#6aa77c"},
  {id:"purple", n:"بنفسجي", h:"#8a6bbd"}, {id:"smokey", n:"سموكي", h:"#4d4550"}
];
const BLUSH = [
  {id:"none", n:"بدون", h:"transparent"}, {id:"soft", n:"وردي ناعم", h:"#f2a7b8"},
  {id:"peach", n:"خوخي", h:"#f3b090"}, {id:"coral", n:"مرجاني", h:"#eda093"},
  {id:"berry", n:"توتي", h:"#d97a93"}, {id:"gold", n:"لمعة ذهبية", h:"#e8c98a"}
];

function dayKey(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return defaults();
    const s = Object.assign(defaults(), JSON.parse(raw));
    s.outfit = Object.assign(defaults().outfit, s.outfit||{});
    s.outfit.acc = s.outfit.acc || {};
    s.stats = Object.assign(defaults().stats, s.stats||{});
    s.makeup = Object.assign(defaults().makeup, s.makeup||{});
    s.modules = Object.assign(defaults().modules, s.modules||{});
    s.nursery = Object.assign(defaults().nursery, s.nursery||{});
    s.xp = +s.xp||0; s.coins = +s.coins||0;
    if(s.day && s.day.key !== dayKey()) s.day = defaults().day;
    if(!s.day) s.day = defaults().day;
    s.day.tasks = Object.assign({feed:0,play:0,out:0,bath:0,cook:0,pet:0}, s.day.tasks||{});
    s.kitchen = s.kitchen || {};
    ["fridge","freezer","pantry"].forEach(k=>{ s.kitchen[k] = Object.assign({}, (s.kitchen[k]||{})); });
    ["dishes","drinks"].forEach(k=>{ if(!Array.isArray(s.kitchen[k])) s.kitchen[k] = []; });
    s.bath = Object.assign({showers:0, faces:0, hands:0, teeth:0, hair:0, lastShower:""}, s.bath||{});
    if(!Array.isArray(s.pets)) s.pets = [];
    s.petItems = Object.assign({}, s.petItems||{});
    if(!s.petHouse || typeof s.petHouse!=="object") s.petHouse = {};
    s.babyCorner = Object.assign({toys:[], foods:{}, plays:0, songs:0, acts:0, lastSong:null,
      learned:[], stories:0, lastStory:null}, s.babyCorner||{});
    if(!Array.isArray(s.babyCorner.toys)) s.babyCorner.toys = [];
    if(!Array.isArray(s.babyCorner.learned)) s.babyCorner.learned = [];
    s.babyCorner.stories = +s.babyCorner.stories||0;
    if(!s.babyCorner.foods || typeof s.babyCorner.foods!=="object") s.babyCorner.foods = {};
    return s;
  }catch(e){ return defaults(); }
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function levelInfo(){
  const lv = Math.floor(S.xp/100)+1;
  return {lv, inLv:S.xp%100};
}
function addXp(n){
  S.xp += n;
  toast("+"+n+" خبرة ⭐");
}
function addCoins(n){ S.coins = Math.max(0, S.coins + n); }

/* ================= toast ================= */
let toastT=null;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove("on"), 1900);
}

/* ================= header / tabs ================= */
function paintChrome(){
  const lv = levelInfo();
  $("#coins").textContent = "🪙 " + S.coins;
  $("#lvl").textContent = "⭐ " + lv.lv;
  const tabs = $("#tabs");
  if(!S.started || S.view==="start" || S.view==="hospital"){ tabs.classList.add("hidden"); return; }
  tabs.classList.remove("hidden");
  const list = [
    ["home","🏠","البيت", true],
    ["wardrobe","👗","الدولاب", S.modules.wardrobe],
    ["kitchen","🍳","المطبخ", S.modules.kitchen],
    ["pets","🐾","الحيوانات", S.modules.pets],
    ["store","🛒","المتجر", S.modules.store]
  ].filter(x=>x[3]);
  list.push(["features","✨","الميزات", true]);
  const inner = tabs.firstElementChild;
  inner.innerHTML = list.map(([id,em,label])=>
    `<button data-view="${id}" class="${S.view===id?"on":""}"><span class="i">${em}</span>${label}</button>`).join("");
  [...inner.children].forEach(b=>b.onclick=()=>go(b.dataset.view));
}
function go(view){ S.view = view; save(); render(); window.scrollTo(0,0); }

/* ================= screens ================= */
function render(){
  paintChrome();
  const r = {
    start:viewStart, hospital:viewHospital, home:viewHome, wardrobe:viewWardrobe,
    makeup:viewMakeup, outings:viewOutings, nursery:viewNursery, album:viewAlbum,
    kitchen:viewKitchen, bath:viewBath, pets:viewPets, store:viewStore,
    babyCorner:viewBabyCorner,
    features:viewFeatures, settings:viewSettings
  }[S.view||"home"];
  if(!r){ S.view="home"; return render(); }
  $("#screen").innerHTML = r();
  bind();
}

/* ---------- kitchen ---------- */
let kf = {tab:"fridge"};
function ingById(id){ return INGREDIENTS.find(x=>x.id===id); }
function stockOf(id){
  const g = ingById(id); if(!g) return 0;
  return +(S.kitchen[g.zone][id]||0);
}
function canCook(r){
  return Object.keys(r.need).every(k=>stockOf(k) >= r.need[k]);
}
function viewKitchen(){
  const tabs = [["fridge","🧊","الثلاجة"],["freezer","❄️","الفريزر"],["pantry","🥫","رف المؤن"],["cook","🍳","محطة الطبخ"],["table","🍽️","السفرة"]];
  if(!tabs.some(t=>t[0]===kf.tab)) kf.tab = "fridge";
  let body = "";
  if(kf.tab==="fridge"||kf.tab==="freezer"||kf.tab==="pantry"){
    const zone = kf.tab;
    const list = INGREDIENTS.filter(g=>g.zone===zone && stockOf(g.id)>0);
    body = `
    <div class="card">
      <b>${ZONES[zone]}</b>
      <p class="muted" style="margin:4px 0 10px">${list.length? "دوسي على + تجيبي حاجة زيادة":"فاضية — اشتري مكونات من المتجر"}</p>
      ${list.length? list.map(g=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)">
        <div style="font-size:26px">${g.em}</div>
        <div class="grow"><b>${g.n}</b><div class="muted">عندك ${stockOf(g.id)}</div></div>
        <button class="btn soft" data-buying="${g.id}" style="padding:8px 12px">+ ${g.p} 🪙</button>
      </div>`).join("") : ""}
      <button class="btn" data-view="store" style="width:100%;margin-top:12px">افتحي المتجر 🛒</button>
    </div>`;
  } else if(kf.tab==="cook"){
    body = `<div class="card"><b>محطة الطبخ</b><p class="muted" style="margin:4px 0 12px">اختاري أكلة أو مشروب — المكونات هتتخصم من المطبخ.</p></div>
    <div class="grid2">
    ${RECIPES.map(r=>{
      const ok = canCook(r);
      const need = Object.keys(r.need).map(k=>{
        const g = ingById(k), have=stockOf(k), q=r.need[k];
        return `<span style="color:${have>=q?"#3f8f68":"#c0566b"}">${g.em} ${g.n} ${have}/${q}</span>`;
      }).join(" · ");
      return `<div class="card" style="margin:0">
        <div style="font-size:34px;text-align:center">${r.em}</div>
        <b style="display:block;text-align:center;margin-top:4px">${r.n}</b>
        <div class="muted" style="font-size:11.5px;text-align:center;margin:6px 0 10px;line-height:1.7">${need}</div>
        <button class="btn ${ok?"":"ghost"}" data-cook="${r.id}" ${ok?"":"disabled style='opacity:.5'"}>${ok?"اطبخي 🍳":"مكونات ناقصة"}</button>
      </div>`;
    }).join("")}
    </div>`;
  } else {
    const all = [...S.kitchen.dishes.map((id,i)=>({id,i,kind:"dishes"})), ...S.kitchen.drinks.map((id,i)=>({id,i,kind:"drinks"}))];
    body = `<div class="card" style="text-align:center;padding:18px">
      <div style="font-size:40px">🍽️</div><b>السفرة الطويلة</b>
      <p class="muted" style="margin:4px 0 0">${all.length? all.length+" حاجة جاهزة للتقديم":"لسه مفيش أكل على السفرة"}</p>
    </div>
    ${all.length? `<div class="card">${all.map((it,idx)=>{
      const r = RECIPES.find(x=>x.id===it.id)||{n:"حاجة",em:"🍽️"};
      return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)">
        <div style="font-size:26px">${r.em}</div>
        <div class="grow"><b>${r.n}</b><div class="muted">${it.kind==="drinks"?"مشروب":"طبق"}</div></div>
        <button class="btn soft" data-serve="${idx}" data-kind="${it.kind}" style="padding:8px 12px">قدّميها</button>
      </div>`;}).join("")}</div>` : `<button class="btn big" data-ktab="cook" style="width:100%">يلا نطبخ 🍳</button>`}`;
  }
  return `
  <h2 class="sec">المطبخ <small>مكونات وطبخ من إبداعك</small></h2>

  if(S.view==="start"){
    [...scr.querySelectorAll("[data-g]")].forEach(b=>b.onclick=()=>{ S.gender=b.dataset.g; render(); });

      S.momName = ($("#inMom").value||"").trim() || "أم ليان";
      S.babyName = ($("#inBaby").value||"").trim() || (S.gender==="girl"?"ليان":"يوسف");

/* ================= actions ================= */
function care(id){
  const c = CARE.find(x=>x.id===id); if(!c) return;
  const T = S.day.tasks;
  S.stats.hunger = clamp(S.stats.hunger + (c.st.hunger||0), 0, 100);
  S.stats.happy  = clamp(S.stats.happy  + (c.st.happy||0), 0, 100);
  S.stats.energy = clamp(S.stats.energy + (c.st.energy||0), 0, 100);
  S.stats.clean  = clamp(S.stats.clean  + (c.st.clean||0), 0, 100);
  if(id==="feed") T.feed=(T.feed||0)+1;
  if(id==="play") T.play=(T.play||0)+1;
  if(id==="bath") T.bath=(T.bath||0)+1;
  addCoins(c.c); addXp(4); S.moments++;
  S.baby.mood = S.stats.happy>70?"سعيدة":S.stats.happy>40?"مرتاحة":"محتاجة حضن";
  save(); toast(`${c.n}: +${c.c} 🪙`); render();
}

function buy(id){
  const g = byId(id); if(!g) return;
  if(S.owned.includes(id)) return;
  if(S.coins < g.p){ toast("معاكيش فلوس كفاية 🪙"); return; }
  S.coins -= g.p; S.owned.push(id); addXp(3); save();
  toast(`اشتريتي ${g.name} — ${colorOf(g.color).n}`); render();
}
function wear(id, who){
  const g = byId(id); if(!g) return;
  if(who==="baby"){ S.babyOutfit = id; save(); toast("البيبي لبس الجديد 👶"); render(); return; }
  if(g.cat==="acc"){ S.outfit.acc[g.kind] = id; }
  else if(g.cat==="dress"){ S.outfit.dress = id; S.outfit.top=null; S.outfit.bottom=null; }
  else if(g.cat==="top"){ S.outfit.top = id; S.outfit.dress = null; }
  else if(g.cat==="bottom"){ S.outfit.bottom = id; S.outfit.dress = null; }
  else S.outfit[g.cat] = id;
  save(); toast("اتلبست ✓"); render();
}
function takeOff(id, who){
  const g = byId(id); if(!g) return;
  if(who==="baby"){ if(S.babyOutfit===id) S.babyOutfit=null; }
  else if(g.cat==="acc"){ if(S.outfit.acc[g.kind]===id) delete S.outfit.acc[g.kind]; }
  else if(S.outfit[g.cat]===id) S.outfit[g.cat]=null;
  save(); toast("اتقلعت"); render();
}
function sell(id){
  const g = byId(id); if(!g) return;
  if(!S.owned.includes(id)) return;
  if(!confirm(`هتشيلي "${g.name}" من الدولاب وترجعلك ${Math.floor(g.p/2)} 🪙. متأكدة؟`)) return;
  takeOff(id, g.cat==="baby"?"baby":"mom");
  S.owned = S.owned.filter(x=>x!==id);
  addCoins(Math.floor(g.p/2));
  save(); toast("اتشالت من الدولاب"); render();
}

function outing(id){
  const d = DESTS.find(x=>x.id===id); if(!d) return;
  if(d.season!=="all" && d.season!==S.season){ toast("مش في الموسم ده ❄️"); return; }
  if(S.stats.happy < 35){ toast("البيبي محتاجة حضن ورضاعة الأول 🤱"); return; }
  let bonus = 0, note = "";
  const dress = S.outfit.dress? byId(S.outfit.dress):null;
  if(!dress && !S.outfit.top){ bonus = -10; note = " خرجتي من غير تجهيز لبس."; }
  else if(dress && dress.w==="heavy" && (S.season==="summer")){ bonus=-5; note=" اللبس تقيل شوية على الحر."; }
  else if(dress && dress.w==="light" && S.season==="winter"){ bonus=-5; note=" خدي جاكيت معاكي، الجو بارد."; }
  else { bonus = 10; note=" اللبس مناسب للجو ✨"; }
  const gain = Math.max(5, d.c + bonus);
  addCoins(gain); addXp(8); S.moments++;
  S.day.tasks.out = (S.day.tasks.out||0)+1;
  S.stats.energy = clamp(S.stats.energy-8,0,100);
  S.stats.happy = clamp(S.stats.happy+10,0,100);
  S.photos.push({
    em: d.em, n: d.n,
    note,
    date: new Date().toLocaleDateString("ar-EG")
  });
  if(S.photos.length>40) S.photos.shift();
  save();
  toast(`خروجة ${d.n}: +${gain} 🪙`);
  render();
}

/* ---- kitchen actions ---- */
function buyIngredient(id){
  const g = ingById(id); if(!g) return;
  if(S.coins < g.p){ toast("معاكيش فلوس كفاية 🪙"); return; }
  S.coins -= g.p;
  S.kitchen[g.zone][id] = (S.kitchen[g.zone][id]||0)+1;
  addXp(2); save(); toast(`اشتريتي ${g.n} 🛒`); render();
}
function cook(id){
  const r = RECIPES.find(x=>x.id===id); if(!r) return;
  if(!canCook(r)){ toast("مكونات ناقصة — اشتريها من المتجر"); return; }
  Object.keys(r.need).forEach(k=>{
    const g = ingById(k);
    S.kitchen[g.zone][k] = Math.max(0, stockOf(k) - r.need[k]);
  });
  const book = r.type==="drink"? "drinks":"dishes";
  S.kitchen[book].push(r.id);
  if(S.kitchen[book].length>12) S.kitchen[book].shift();
  S.day.tasks.cook = (S.day.tasks.cook||0)+1;
  addXp(r.xp||5); save();
  toast(`عملتي ${r.n}! ${r.type==="drink"?"🧃":"🍳"}`); render();
}
function serve(kind, idx){
  if(kind!=="dishes" && kind!=="drinks") return;
  const arr = S.kitchen[kind]; if(!arr || idx<0 || idx>=arr.length) return;
  const r = RECIPES.find(x=>x.id===arr[idx])||{n:"حاجة"};
  arr.splice(idx,1);
  addCoins(6); addXp(2); save();
  toast(`قدّمتي ${r.n} على السفرة +6 🪙`); render();
}

/* ---- bath actions ---- */
function bathAct(id){
  const a = BATH_ACTS.find(x=>x.id===id); if(!a) return;
  let gain = a.c, msg = `${a.n} ✓ +${a.c} 🪙`;
  if(id==="shower"){
    const first = S.bath.lastShower !== dayKey();
    if(first){ gain += 10; S.bath.lastShower = dayKey(); msg = `دش بماء دافي +${gain} 🪙 — نضفتي وجسمك ارتاح ✨`; }
    S.day.tasks.bath = (S.day.tasks.bath||0)+1;
  }
  const key = {shower:"showers", face:"faces", hands:"hands", teeth:"teeth", hair:"hair", skincare:"skincare"}[id];
  if(key) S.bath[key] = (S.bath[key]||0)+1;
  addCoins(gain); addXp(a.xp||2); save(); toast(msg); render();
}

/* ---- pet actions ---- */
function findPet(uid){ return S.pets.find(p=>p.uid===uid); }
function buyPet(kind){
  const def = petDef(kind); if(!def) return;
  if(S.pets.length>=6){ toast("عندك 6 حيوانات — الحد الأقصى"); return; }
  if(S.coins < def.p){ toast("معاكيش فلوس كفاية 🪙"); return; }
  S.coins -= def.p;
  S.pets.push({
    uid: "p"+Date.now().toString(36)+Math.floor(Math.random()*999),
    kind: def.id, name: def.n, hunger: 70, happy: 65, clean: 85, level: 1,
    equip: {}, born: dayKey()
  });
  addXp(10); save(); toast(`جبتي ${def.n} جديد! 🐾`); render();
}
function buySupply(id){
  const it = petItem(id); if(!it) return;
  if(S.coins < it.p){ toast("معاكيش فلوس كفاية 🪙"); return; }
  S.coins -= it.p;
  S.petItems[id] = (S.petItems[id]||0)+1;
  addXp(2); save(); toast(`اشتريتي ${it.n} ${it.em}`); render();
}
function petAct(uid, act){
  const p = findPet(uid); if(!p) return;
  if(act==="feed"){
    if((S.petItems.petfood||0)<=0){ toast("مفيش أكل — اشتري أكل حيوانات من المتجر 🥫"); return; }
    S.petItems.petfood -= 1;
    p.hunger = clamp(p.hunger+30, 0, 100);
    toast("أكلت وشبعت 🍖");
  } else if(act==="water"){
    p.hunger = clamp(p.hunger+8, 0, 100); p.happy = clamp(p.happy+4, 0, 100);
    toast("شربت مية 💧");
  } else if(act==="play"){
    p.happy = clamp(p.happy+18, 0, 100); p.clean = clamp(p.clean-6, 0, 100);
    toast("لعبتي معاها 🎾");
  } else if(act==="clean"){
    p.clean = clamp(p.clean+30, 0, 100); p.happy = clamp(p.happy+6, 0, 100);
    toast("نضفتيها 🧼");
  } else if(act==="train"){
    p.happy = clamp(p.happy+10, 0, 100);
    p.level = (p.level||1)+1;
    toast(`اتدربت! المستوى ${p.level} 🎓`);
  } else return;
  S.day.tasks.pet = (S.day.tasks.pet||0)+1;
  addCoins(5); addXp(3); save(); render();
}
function petEquip(uid, cat, itemId){
  const p = findPet(uid); if(!p) return;
  if(!(S.petItems[itemId]>0)){ toast("الحاجة دي مش عندك — اشتريها الأول"); return; }
  p.equip = p.equip || {};
  p.equip[cat] = p.equip[cat]===itemId? null : itemId;
  save(); render();
}
function renamePet(uid, name){
  const p = findPet(uid); if(!p) return;
  const n = (name||"").trim();
  if(!n) return;
  p.name = n.slice(0,14); save(); render();
}

/* ---- baby corner actions ---- */
function buyBabyToy(id){
  const t = babyToy(id); if(!t) return;
  if(S.babyCorner.toys.includes(id)){ toast("اللعبة دي عندك بالفعل"); return; }
  if(S.coins < t.p){ toast("معاكيش فلوس كفاية 🪙"); return; }
  S.coins -= t.p; S.babyCorner.toys.push(id); addXp(3);
  save(); toast(`اشتريتي ${t.n} ${t.em}`); render();
}
function playBabyToy(id){
  const t = babyToy(id); if(!t) return;
  S.stats.happy = clamp(S.stats.happy+8, 0, 100);
  S.stats.energy = clamp(S.stats.energy-3, 0, 100);
  S.babyCorner.plays = (S.babyCorner.plays||0)+1;
  S.day.tasks.play = (S.day.tasks.play||0)+1;
  addCoins(4); addXp(3); save();
  toast(`لعبتي ${t.n} مع ${S.babyName||"البيبي"} ${t.em}`); render();
}
function buyBabyFood(id){
  const f = babyFood(id); if(!f) return;
  if(S.coins < f.p){ toast("معاكيش فلوس كفاية 🪙"); return; }
  S.coins -= f.p; S.babyCorner.foods[id] = (S.babyCorner.foods[id]||0)+1;
  addXp(2); save(); toast(`اشتريتي ${f.n} ${f.em}`); render();
}
function feedBabyFood(id){
  const f = babyFood(id); if(!f) return;
  if((S.babyCorner.foods[id]||0)<=0){ toast("مفيش من الأكل ده — اشتريه الأول"); return; }
  S.babyCorner.foods[id] -= 1;
  S.stats.hunger = clamp(S.stats.hunger+f.h, 0, 100);
  S.stats.happy = clamp(S.stats.happy+5, 0, 100);
  S.day.tasks.feed = (S.day.tasks.feed||0)+1;
  addCoins(3); addXp(3); save();
  toast(`${S.babyName||"البيبي"} أكل ${f.n} ${f.em}`); render();
}
function singBabySong(id){
  const s = babySong(id); if(!s) return;
  S.stats.happy = clamp(S.stats.happy+4, 0, 100);
  S.stats.energy = clamp(S.stats.energy+2, 0, 100);
  S.babyCorner.songs = (S.babyCorner.songs||0)+1;
  S.babyCorner.lastSong = id;
  addXp(2); save();
  toast(`غنيتي «${s.n}» ${s.em}`); render();
}
function babyAct(id){
  const a = BABY_ACTS.find(x=>x.id===id); if(!a) return;
  S.stats.happy = clamp(S.stats.happy+(a.h||0), 0, 100);
  S.stats.energy = clamp(S.stats.energy+(a.e||0), 0, 100);
  S.stats.clean = clamp(S.stats.clean+(a.c||0), 0, 100);
  S.babyCorner.acts = (S.babyCorner.acts||0)+1;
  S.day.tasks.play = (S.day.tasks.play||0)+1;
  addCoins(3); addXp(2); save();
  toast(`${a.n} ✓ +3 🪙`); render();
}
function learnCard(id){
  const c = BABY_LEARN.find(x=>x.id===id); if(!c) return;
  const bc = S.babyCorner;
  if(!Array.isArray(bc.learned)) bc.learned = [];
  const first = !bc.learned.includes(id);
  if(first){
    bc.learned.push(id);
    S.stats.happy = clamp(S.stats.happy+3, 0, 100);
    addCoins(4); addXp(5); save();
    toast(`اتعلمتي ${c.n} — ${c.line} ${c.em} +4 🪙`);
  } else {
    addCoins(1); addXp(1); save();
    toast(`${c.n} — ${c.line} ${c.em}`);
  }
  render();
}
function readStory(id){
  const s = BABY_STORIES.find(x=>x.id===id); if(!s) return;
  const bc = S.babyCorner;
  bc.stories = (bc.stories||0)+1;
  bc.lastStory = id;
  S.stats.happy = clamp(S.stats.happy+4, 0, 100);
  S.stats.energy = clamp(S.stats.energy+2, 0, 100);
  S.day.tasks.play = (S.day.tasks.play||0)+1;
  addCoins(3); addXp(3); save();
  toast(`📖 ${s.n} — ${s.line}`); render();
}

/* ================= boot ================= */
if(!S.started){ S.view = "start"; } else if(!S.view || S.view==="start"){ S.view="home"; }
if(S.seasonAuto) S.season = seasonNow();
render();
// debug/automation hook — read & drive state without touching the UI
window.__mom = {
  get state(){ return S; },
  go, featureList, care, buy, wear, takeOff, outing,
  buyIngredient, cook, serve, bathAct, buyPet, buySupply, petAct, petEquip, renamePet,
  buyBabyToy, playBabyToy, buyBabyFood, feedBabyFood, singBabySong, babyAct, learnCard, readStory,
  get kitchenTab(){ return kf.tab; }, set kitchenTab(v){ kf.tab=v; },
  get babyTab(){ return bf.tab; }, set babyTab(v){ bf.tab=v; },
  get storeTab(){ return sf.tab; }, set storeTab(v){ sf.tab=v; },
  get storeZone(){ return sf.zone; }, set storeZone(v){ sf.zone=v; }
};
</script>
